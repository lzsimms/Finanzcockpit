  return n;
}
const optNum = v => { const n = parseNum(v); return Number.isFinite(n) ? n : 0; };
const reqDate = v => { if (!/^\d{4}-\d{2}-\d{2}$/.test(v || '')) throw new Error('Bitte ein gültiges Datum wählen.'); return v; };
const accOpts = (filter = () => true) => S.accounts.filter(filter).map(a => [a.id, `${accEmoji(a)} ${a.name}`]);

function txModal(t, preset = {}) {

  const isEdit = !!t;
  const d = t ? { ...t } : { kind: preset.kind || 'expense', amount: preset.amount || '', accountId: preset.accountId || defaultAccountId(), toAccountId: '', category: '', date: today(), note: preset.note || '' };
  const chosen = { expense: d.kind === 'expense' ? d.category : '', income: d.kind === 'income' ? d.category : '' };

  const other = S.accounts.find(a => a.id !== d.accountId);
  openModal({
    title: isEdit ? 'Buchung bearbeiten' : 'Neue Buchung', submit: isEdit ? 'Speichern' : 'Buchen',

      <div class="row2">${F.field('Datum', F.date('date', d.date))}${F.field('Notiz', F.text('note', d.note, 'list="noteList" maxlength="80" placeholder="z. B. Rewe, Tankstelle …"'))}</div>
      <datalist id="noteList">${notes.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      ${isEdit && t.recurringId ? '<p class="hint">↻ Automatisch aus einem Dauerauftrag gebucht. Änderungen betreffen nur diese Buchung.</p>' : ''}`,
    onOpen(form) {
      const grid = form.querySelector('#catGrid');
      const sync = () => {
        const kind = form.kind.value;

        form.querySelector('.to-wrap').hidden = kind !== 'transfer';

      };
      const learn = () => {
        const n = form.note.value.trim().toLowerCase(); if (!n) return;
        const kind = form.kind.value;
        const prev = sortedTx().find(x => (x.note || '').toLowerCase() === n && x.kind === kind && x.category);

function deleteTx(id) {

  const [t] = S.transactions.splice(i, 1);

}

function accountModal(id, presetType) {
  const a = id ? acc(id) : null;

  const used = a ? S.transactions.filter(x => x.accountId === a.id || x.toAccountId === a.id).length + S.holdings.filter(h => h.accountId === a.id).length : 0;
  openModal({
    title: a ? 'Konto bearbeiten' : 'Neues Konto',
    body: `${F.field('Name', F.text('name', d.name, 'maxlength="40" placeholder="z. B. Girokonto Sparkasse" required'))}

      ${F.field(a ? 'Startsaldo' : 'Aktueller Kontostand', F.money('opening', d.opening, '', 2), a ? 'Saldo vor der ersten erfassten Buchung. Zum Korrigieren des aktuellen Stands nutze besser „Saldo abgleichen“.' : 'Bei einem Depot: nur das Cash auf dem Verrechnungskonto. Wertpapiere fügst du im Depot hinzu.')}

    onSubmit(fd) {
      const name = (fd.name || '').trim(); if (!name) throw new Error('Bitte einen Namen eingeben.');
      const opening = round2(optNum(fd.opening));

      else S.accounts.push({ id: uid(), name, type: fd.type, opening, color: fd.color || d.color, icon: fd.icon || ACC_TYPES[fd.type].emoji });
      commit(a ? 'Konto gespeichert' : `Konto „${name}“ angelegt`);
    },
    onDelete: a ? async () => {
      const ok = await confirmDialog({ title: `„${esc(a.name)}“ löschen?`, text: used ? `Damit werden auch <b>${used} zugehörige Buchungen/Positionen</b> unwiderruflich gelöscht.` : 'Das Konto wird gelöscht.', ok: 'Endgültig löschen', danger: true });
      if (!ok) return false;
      const hIds = new Set(S.holdings.filter(h => h.accountId === a.id).map(h => h.id));
      S.transactions = S.transactions.filter(x => x.accountId !== a.id && x.toAccountId !== a.id);
      S.recurring = S.recurring.filter(r => r.accountId !== a.id && r.toAccountId !== a.id);
      S.trades = S.trades.filter(x => !hIds.has(x.holdingId) && x.accountId !== a.id);
      S.plans = S.plans.filter(p => !hIds.has(p.holdingId));
      S.holdings = S.holdings.filter(h => !hIds.has(h.id));
      S.goals.forEach(g => { if (g.accountId === a.id) g.accountId = ''; });
      S.accounts = S.accounts.filter(x => x.id !== a.id);

}

      const priceChanged = !h || h.price !== price;
      const obj = { name, isin, type: fd.type, price, color: fd.color || d.color, accountId: fd.accountId || d.accountId };
      if (priceChanged) obj.priceDate = today();
      if (h) { Object.assign(h, obj); commit('Position gespeichert'); return; }
      const nh = { id: uid(), ...obj, priceDate: today() }; S.holdings.push(nh);
      const sh = parseNum(fd.shares);
      if (sh > 0) {
        const avg = reqNum(fd.avg, 'Bitte den Ø Kaufkurs eingeben.');
        S.trades.push({ id: uid(), ts: nextTs(), holdingId: nh.id, accountId: nh.accountId, date: reqDate(fd.date), side: 'buy', shares: round6(sh), price: avg, fee: 0, noCash: fd.noCash === 'on' });
      }
      commit(`„${name}“ hinzugefügt`);
    },
    onDelete: h ? async () => {
      if (!(await confirmDialog({ title: `${esc(h.name)} löschen?`, text: 'Alle Orders und Sparpläne dieser Position werden ebenfalls gelöscht. Erhaltene Dividenden bleiben als Buchungen erhalten.', ok: 'Löschen', danger: true }))) return false;
      S.trades = S.trades.filter(x => x.holdingId !== h.id); S.plans = S.plans.filter(p => p.holdingId !== h.id); S.holdings = S.holdings.filter(x => x.id !== h.id);
      commit('Position gelöscht');
    } : null,
  });
}

function tradeModal(side = 'buy', holdingId, tradeId) {
  if (!needDepot()) return;
  const tr = tradeId ? S.trades.find(x => x.id === tradeId) : null;
  const list = S.holdings.filter(h => !UI.depot || h.accountId === UI.depot || tr);
  if (!list.length) { toast('Lege zuerst eine Position an.', 'err'); holdingModal(); return; }
  const c = computeAll();
  const d = tr ? { ...tr } : { side, holdingId: holdingId || list[0].id, shares: '', price: hold(holdingId || list[0].id).price, fee: 1, date: today(), noCash: false };
  openModal({
    title: tr ? 'Order bearbeiten' : 'Order erfassen', submit: tr ? 'Speichern' : 'Ausführen',
    body: `${F.seg('side', [['buy', 'Kauf'], ['sell', 'Verkauf']], d.side, 'kind-seg')}
      ${F.field('Wertpapier', F.select('holdingId', list.map(h => [h.id, `${h.name} (${fmtShares(c.hold[h.id].shares)} Stk.)`]), d.holdingId))}
      <div class="row3">${F.field('Stück', F.text('shares', d.shares === '' ? '' : fmtShares(d.shares), 'inputmode="decimal" placeholder="0" autofocus'))}${F.field('Kurs', F.money('price', d.price, '', 4))}${F.field('Gebühr', F.money('fee', d.fee))}</div>
      <div class="row2">${F.field('Datum', F.date('date', d.date))}${F.field('… oder Betrag eingeben', F.money('invest', ''), 'Stückzahl wird automatisch berechnet')}</div>
      <div class="preview"><span id="trLbl">Gesamt</span><b class="money" id="trTotal">–</b></div>
      ${F.check('noCash', 'Depotübertrag – Verrechnungskonto nicht belasten', d.noCash)}
      ${tr?.planId ? '<p class="hint">Diese Order wurde automatisch durch einen Sparplan ausgeführt.</p>' : ''}`,
    onOpen(form) {
      const upd = () => {
        const sh = parseNum(form.shares.value), p = parseNum(form.price.value), f = optNum(form.fee.value), buy = form.side.value === 'buy';
        form.querySelector('#trLbl').textContent = buy ? 'Gesamtkosten' : 'Erlös';
        form.querySelector('#trTotal').textContent = sh > 0 && p > 0 ? fmt(buy ? sh * p + f : sh * p - f) : '–';
      };
      const byAmount = () => { const amt = parseNum(form.invest.value), p = parseNum(form.price.value); if (amt > 0 && p > 0) form.shares.value = fmtShares(round6(amt / p)); };
      form.addEventListener('input', e => { if (e.target.name === 'invest' || (e.target.name === 'price' && form.invest.value)) byAmount(); else if (e.target.name === 'shares') form.invest.value = ''; upd(); });
      form.addEventListener('change', e => { if (e.target.name === 'holdingId' && !tr) { form.price.value = fmtNumIn(hold(e.target.value).price, 4); byAmount(); upd(); } if (e.target.name === 'side') upd(); });
      upd();
    },
    onSubmit(fd) {
      const h = hold(fd.holdingId), sh = round6(reqNum(fd.shares, 'Bitte die Stückzahl eingeben.')), price = reqNum(fd.price, 'Bitte den Kurs eingeben.'), fee = round2(optNum(fd.fee)), date = reqDate(fd.date);
      if (fd.side === 'sell') {
        const avail = c.hold[h.id].shares + (tr && tr.side === 'sell' && tr.holdingId === h.id ? tr.shares : 0) - (tr && tr.side === 'buy' && tr.holdingId === h.id ? tr.shares : 0);
        if (sh > avail + 1e-9) throw new Error(`Du hast nur ${fmtShares(avail)} Stück im Bestand.`);
      }
      const obj = { holdingId: h.id, accountId: h.accountId, date, side: fd.side, shares: sh, price, fee, noCash: fd.noCash === 'on' };
      if (tr) Object.assign(tr, obj); else S.trades.push({ id: uid(), ts: nextTs(), ...obj });
      if (!h.priceDate || date >= h.priceDate) { h.price = price; h.priceDate = date; }
      commit(tr ? 'Order gespeichert' : `${fd.side === 'buy' ? 'Kauf' : 'Verkauf'}: ${fmtShares(sh)} × ${h.name}`);
    },
    onDelete: tr ? async () => {
      if (!(await confirmDialog({ title: 'Order löschen?', text: 'Bestand und Verrechnungskonto werden entsprechend zurückgerechnet.', ok: 'Löschen', danger: true }))) return false;
      S.trades = S.trades.filter(x => x.id !== tr.id); commit('Order gelöscht');
    } : null,
  });
}

/* ---------- Sicherheit & Daten ---------- */
function passwordModal() {
  openModal({
    title: 'Master-Passwort ändern', submit: 'Neu verschlüsseln',
    body: `${F.field('Aktuelles Passwort', '<input class="input" type="password" name="cur" autocomplete="current-password" autofocus>')}
      ${F.field('Neues Passwort', '<input class="input" type="password" name="pw1" autocomplete="new-password">', 'Mindestens 8 Zeichen – eine Passphrase aus 4 Wörtern ist ideal.')}
      ${F.field('Neues Passwort wiederholen', '<input class="input" type="password" name="pw2" autocomplete="new-password">')}`,
    async onSubmit(fd) {
      try { await Vault.decryptBlob(Vault.read(), fd.cur); } catch { throw new Error('Das aktuelle Passwort ist falsch.'); }
      if ((fd.pw1 || '').length < 8) throw new Error('Das neue Passwort braucht mindestens 8 Zeichen.');
      if (fd.pw1 !== fd.pw2) throw new Error('Die neuen Passwörter stimmen nicht überein.');
      await saveChain;
      await Vault.create(fd.pw1, S);
      toast('Passwort geändert – alle Daten neu verschlüsselt 🔐');
    },
  });
}
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function exportBackup() {
  await saveChain;
  const blob = await Vault.encryptBlob(S);
  download(`finanzcockpit-backup-${today()}.fcbak`, JSON.stringify(blob), 'application/json');
  S.settings.lastBackup = today(); persist();
  toast('Verschlüsseltes Backup gespeichert');
}
async function exportCSV() {
  if (!(await confirmDialog({ title: 'CSV exportieren?', text: 'Die CSV-Datei ist <b>nicht verschlüsselt</b> und für jeden lesbar, der Zugriff auf die Datei hat.', ok: 'Exportieren' }))) return;
  const q = s => `"${String(s == null ? '' : s).replace(/"/g, '""')}"`;
  const rows = [['Datum', 'Art', 'Betrag', 'Kategorie', 'Konto', 'Zielkonto', 'Notiz']];
  for (const t of sortedTx()) rows.push([fmtDate(t.date), { expense: 'Ausgabe', income: 'Einnahme', transfer: 'Umbuchung' }[t.kind], fmtNum(t.kind === 'expense' ? -t.amount : t.amount), cat(t.category)?.name || '', acc(t.accountId)?.name || '', acc(t.toAccountId)?.name || '', t.note || '']);
  download(`finanzcockpit-buchungen-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  toast(`${rows.length - 1} Buchungen exportiert`);
}
function importModal(fromLock) {
  openModal({
    title: 'Backup wiederherstellen', submit: 'Entschlüsseln & laden',
    body: `<p class="muted">Wähle eine <b>.fcbak</b>-Datei und gib das Passwort ein, mit dem das Backup erstellt wurde. Danach gilt dieses Passwort für den Tresor.</p>
      ${F.field('Backup- oder Sync-Datei', '<input class="input" type="file" name="file" style="padding-top:9px">', 'Neues Gerät einrichten? Lade hier die Sync-Datei vom ersten Gerät – dann teilen sich beide denselben Tresor.')}
      ${F.field('Passwort des Backups', '<input class="input" type="password" name="pw" autocomplete="off">')}`,
    async onSubmit(fd, form) {
      const file = form.file.files[0]; if (!file) throw new Error('Bitte eine Datei auswählen.');
      if (file.size > 20e6) throw new Error('Die Datei ist zu groß.');
      let blob; try { blob = JSON.parse(await file.text()); } catch { throw new Error('Die Datei ist kein gültiges Backup.'); }
      let r; try { r = await Vault.decryptBlob(blob, fd.pw || ''); } catch (e) { throw new Error(e.name === 'OperationError' ? 'Falsches Passwort für dieses Backup.' : e.message); }
      if (!fromLock && !(await confirmDialog({ title: 'Aktuelle Daten ersetzen?', text: 'Alle aktuellen Daten werden durch das Backup ersetzt. Das lässt sich nicht rückgängig machen.', ok: 'Ersetzen', danger: true }))) return false;
      await saveChain;
      Vault.adopt(r); S = migrate(r.data); C = null; resetBaseline();
      await Vault.save(S);
      closeModal();
      const stand = `Stand ${new Date(blob.saved || Date.now()).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' })} · ${S.accounts.length} Konten · ${S.transactions.length} Buchungen`;
      if (fromLock) { afterUnlock(); toast('Übernommen – ' + stand, 'info'); } else commit('Backup wiederhergestellt – ' + stand);
      return false;
    },
  });
}

   Demo-Daten: 12 Monate realistischer Finanzalltag

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildDemo() {
  const s = defaultState();
  s.settings.onboarded = true; s.settings.demo = true;
  const R = mulberry32(20261118), rr = (a, b) => a + R() * (b - a), pick = a => a[Math.floor(R() * a.length)];
  const t = today(), start = addMonths(t.slice(0, 7) + '-01', -12);
  const mk = o => ({ id: uid(), ...o });
  const cash = mk({ name: 'Bargeld', type: 'cash', opening: 180, color: '#f5b544', icon: '💶' });
  const giro = mk({ name: 'Girokonto', type: 'bank', opening: 2100, color: '#7c6cff', icon: '🏦' });
  const tg = mk({ name: 'Tagesgeld', type: 'bank', opening: 6200, color: '#22d3ee', icon: '🐷' });
  const tr = mk({ name: 'Trade Republic', type: 'depot', opening: 7600, color: '#2fd47a', icon: '📈' });
  s.accounts = [cash, giro, tg, tr];
  let ts = 1; const T = o => s.transactions.push({ id: uid(), ts: ts++, ...o });

  // Wertpapiere mit simuliertem Kursverlauf (endet exakt beim "aktuellen" Demo-Kurs)
  const weeks = Math.ceil(daysBetween(start, t) / 7) + 1, paths = {};
  const H = [
    ['iShares Core MSCI World', 'IE00B4L5Y983', 'ETF', 112.4, 0.0018, 0.018, '#7c6cff'],
    ['Vanguard FTSE All-World', 'IE00BK5BQT80', 'ETF', 141.8, 0.0016, 0.017, '#22d3ee'],
    ['Xtrackers MSCI Emerging Markets', 'IE00BTJRMP35', 'ETF', 62.1, 0.0012, 0.022, '#2fd47a'],
    ['Apple', 'US0378331005', 'Aktie', 245.3, 0.0022, 0.034, '#a78bfa'],
    ['Bitcoin', 'XF000BTC0017', 'Krypto', 78500, 0.0035, 0.055, '#f5b544'],
  ];
  s.holdings = H.map(([name, isin, type, price, drift, vol, color]) => {
    const h = mk({ name, isin, type, price, priceDate: t, accountId: tr.id, color });
    const p = new Array(weeks); p[weeks - 1] = price;
    for (let i = weeks - 1; i > 0; i--) { const g = (R() + R() + R() - 1.5) * 2; p[i - 1] = p[i] / (1 + drift + vol * g); }
    paths[h.id] = p; return h;
  });
  const priceAt = (h, d) => { const p = paths[h.id][clamp(Math.floor(daysBetween(start, d) / 7), 0, weeks - 1)]; return p > 1000 ? Math.round(p) : round2(p); };
  const [msci, vwrl, em, aapl, btc] = s.holdings;
  const trade = (h, d, side, shares, fee, extra = {}) => s.trades.push({ id: uid(), ts: ts++, holdingId: h.id, accountId: tr.id, date: d, side, shares: round6(shares), price: priceAt(h, d), fee, ...extra });
  trade(msci, start, 'buy', 38, 1); trade(aapl, start, 'buy', 12, 1); trade(vwrl, start, 'buy', 10, 1);
  trade(aapl, addMonths(start, 8, 20), 'sell', 4, 1);
  trade(btc, addMonths(start, 5, 9), 'buy', 0.004, 1);
  s.plans = [[msci, 250, 2], [vwrl, 150, 2], [em, 75, 16], [btc, 25, 16]].map(([h, amount, day]) => {
    let d = addMonths(start, 0, day), id = uid();
    while (d <= t) { trade(h, d, 'buy', amount / priceAt(h, d), 0, { planId: id }); d = addMonths(d, 1, day); }
    return { id, holdingId: h.id, amount, interval: 'monthly', day, next: d, paused: false };
  });

  // Alltag
  let cashBal = cash.opening;
  for (let d = start; d <= t; d = addDays(d, 1)) {
    const day = +d.slice(8), month = +d.slice(5, 7), dow = parseDate(d).getDay(), mIdx = daysBetween(start, d) / 30.4;
    if (day === 5 || day === 19) { T({ date: d, kind: 'transfer', amount: 150, accountId: giro.id, toAccountId: cash.id, note: 'Geldautomat' }); cashBal += 150; }
    const spend = (p, category, min, max, notes, cashShare = 0) => {
      if (R() >= p) return;
      const amount = round2(rr(min, max)), useCash = R() < cashShare && cashBal > amount;
      if (useCash) cashBal -= amount;
      T({ date: d, kind: 'expense', amount, accountId: useCash ? cash.id : giro.id, category, note: pick(notes) });
    };
    spend(dow === 6 ? 0.75 : 0.28, 'c_food', 12, 92, ['Rewe', 'Edeka', 'Aldi Süd', 'Lidl', 'dm', 'Wochenmarkt', 'Bäckerei Kamps'], 0.3);
    spend(dow === 5 || dow === 6 ? 0.35 : 0.09, 'c_rest', 8, 58, ['Café Lotte', 'Pizzeria Da Mario', 'Sushi-Bar Kyoto', 'Biergarten', 'Döner Kebab', 'Thai Imbiss', 'Lieferando'], 0.45);
    spend(0.07, 'c_mob', 38, 75, ['Aral', 'Shell', 'Tankstelle', 'Parkhaus', 'DB Fernverkehr']);
    spend(0.055, 'c_shop', 15, 140, ['Amazon', 'Zalando', 'IKEA', 'MediaMarkt', 'H&M', 'Decathlon']);
    spend(dow === 6 || dow === 0 ? 0.12 : 0.035, 'c_fun', 8, 60, ['Kino', 'Konzert', 'Bowling', 'Freibad', 'Kletterhalle', 'Museum'], 0.3);
    spend(0.022, 'c_health', 6, 45, ['Apotheke', 'Physiotherapie', 'Optiker'], 0.2);
    spend(0.012, 'c_edu', 12, 49, ['Thalia', 'Udemy-Kurs', 'Hugendubel']);
    spend(0.01, 'c_gift', 15, 80, ['Geburtstagsgeschenk', 'Blumen', 'Mitbringsel']);
    if (day === 1) {
      T({ date: d, kind: 'income', amount: round2(rr(11, 15)), accountId: tg.id, category: 'c_interest', note: 'Zinsgutschrift Tagesgeld' });
      T({ date: d, kind: 'income', amount: round2(rr(1.5, 4)), accountId: tr.id, category: 'c_interest', note: 'Zinsen Trade Republic' });
    }
    if ([3, 6, 9, 12].includes(month) && day === 25) T({ date: d, kind: 'income', amount: round2(rr(6, 9)), accountId: tr.id, category: 'c_div', note: 'Dividende Vanguard FTSE All-World', holdingId: vwrl.id });
    if ([2, 5, 8, 11].includes(month) && day === 14) T({ date: d, kind: 'income', amount: round2(rr(1.8, 2.6)), accountId: tr.id, category: 'c_div', note: 'Dividende Apple', holdingId: aapl.id });
    if (month === 12 && day === 14) T({ date: d, kind: 'expense', amount: 268.4, accountId: giro.id, category: 'c_gift', note: 'Weihnachtsgeschenke' });
    if (Math.floor(mIdx) === 7 && day === 12) { T({ date: d, kind: 'expense', amount: 690, accountId: giro.id, category: 'c_travel', note: 'Ferienwohnung Gardasee' }); T({ date: d, kind: 'expense', amount: 236, accountId: giro.id, category: 'c_travel', note: 'Flug München–Verona' }); }
    if (Math.floor(mIdx) === 4 && day === 22) T({ date: d, kind: 'income', amount: 642.18, accountId: giro.id, category: 'c_refund', note: 'Steuererstattung' });
    if ((Math.floor(mIdx) === 2 || Math.floor(mIdx) === 9) && day === 27) T({ date: d, kind: 'income', amount: 480, accountId: giro.id, category: 'c_side', note: 'Freelance-Projekt' });
  }

  // Daueraufträge – werden über die echte Buchungslogik bis heute nachgetragen
  const rec = (name, kind, amount, accountId, category, interval, day, first, toAccountId = '') =>
    s.recurring.push({ id: uid(), name, kind, amount, accountId, toAccountId, category, interval, day, next: first || addMonths(start, 0, day), end: '', paused: false });
  rec('Gehalt', 'income', 3380, giro.id, 'c_salary', 'monthly', 1);
  rec('Miete', 'expense', 950, giro.id, 'c_home', 'monthly', 3);
  rec('Strom & Gas', 'expense', 112, giro.id, 'c_home', 'monthly', 15);
  rec('Internet', 'expense', 39.99, giro.id, 'c_home', 'monthly', 5);
  rec('Handyvertrag', 'expense', 19.99, giro.id, 'c_abo', 'monthly', 10);
  rec('Netflix', 'expense', 13.99, giro.id, 'c_abo', 'monthly', 12);
  rec('Spotify', 'expense', 10.99, giro.id, 'c_abo', 'monthly', 20);
  rec('Fitnessstudio', 'expense', 29.9, giro.id, 'c_fun', 'monthly', 1);
  rec('Deutschlandticket', 'expense', 63, giro.id, 'c_mob', 'monthly', 1);
  rec('Haftpflichtversicherung', 'expense', 6.5, giro.id, 'c_ins', 'monthly', 1);
  rec('Kfz-Versicherung', 'expense', 438, giro.id, 'c_ins', 'yearly', 1, addMonths(start, 1, 1));
  rec('Amazon Prime', 'expense', 89.9, giro.id, 'c_abo', 'yearly', 14, addMonths(start, 4, 14));
  rec('Sparrate Trade Republic', 'transfer', 600, giro.id, '', 'monthly', 4, null, tr.id);
  rec('Notgroschen aufstocken', 'transfer', 200, giro.id, '', 'monthly', 4, null, tg.id);
  processDue(s);

  s.goals = [
    { id: uid(), name: 'Notgroschen', emoji: '🛟', target: 12000, saved: 0, accountId: tg.id, deadline: '', color: '#22d3ee' },
    { id: uid(), name: 'Japan-Reise', emoji: '🗾', target: 4500, saved: 1850, accountId: '', deadline: addMonths(t, 10, 1), color: '#ff7a90' },
    { id: uid(), name: 'Neues E-Bike', emoji: '🚲', target: 2800, saved: 2240, accountId: '', deadline: addMonths(t, 4, 1), color: '#2fd47a' },
  ];
  s.budgets = { c_food: 420, c_rest: 160, c_shop: 180, c_fun: 150, c_mob: 200 };

  // Wöchentliche Depot-Snapshots für einen realistischen Vermögensverlauf
  const trs = s.trades.slice().sort(byDateTs), hm = {}; let j = 0;
  for (let d = start; d <= t; d = addDays(d, 7)) {
    while (j < trs.length && trs[j].date <= d) applyTrade(hm, trs[j++], () => { });
    let mv = 0, cb = 0;
    for (const h of s.holdings) { const x = hm[h.id]; if (!x) continue; mv += x.shares * priceAt(h, d); cb += x.cost; }
    s.snapshots.push({ d, mv: round2(mv), cb: round2(cb) });
  }
  return s;
}

/* ---------- Toasts & Effekte ---------- */
function toast(msg, tone = 'ok', opts = {}) {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast ' + tone;
  const act = opts.undo ? { label: 'Rückgängig', run: opts.undo } : opts.action;
  el.innerHTML = `<span class="t-ic">${ic(tone === 'err' ? 'x' : tone === 'info' ? 'sparkle' : 'check', 15, 2.2)}</span><span>${esc(msg)}</span>${act ? `<button class="t-undo">${esc(act.label)}</button>` : ''}`;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  const kill = () => { el.classList.remove('in'); setTimeout(() => el.remove(), 300); };
  const tm = opts.sticky ? null : setTimeout(kill, act ? 6500 : 3200);
  const u = el.querySelector('.t-undo'); if (u) u.addEventListener('click', () => { clearTimeout(tm); act.run(); kill(); });
  while (box.children.length > 4) box.firstElementChild.remove();
}
function confetti() {
  if (reducedMotion()) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight; c.width = W * dpr; c.height = H * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const P = Array.from({ length: 180 }, () => ({ x: W / 2 + (Math.random() - .5) * 120, y: H * .38, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5, r: Math.random() * 7 + 4, c: PALETTE[Math.floor(Math.random() * 10)], a: Math.random() * 6.3, va: (Math.random() - .5) * .35 }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, W, H);
    for (const p of P) { p.vy += .38; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - f / 150); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }
    if (++f < 160) requestAnimationFrame(tick); else c.remove();
  })();
}
function countUp(root) {
  if (reducedMotion()) return;
  $$('[data-count]', root).forEach(el => {
    const to = +el.dataset.count, from = to * 0.86, t0 = performance.now(), dur = 1000;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4); el.textContent = fmt(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

const SYNC_COLS = ['accounts', 'categories', 'transactions', 'recurring', 'holdings', 'trades', 'plans', 'goals'];
let lastSeen = null;   // Fingerabdruck aller Datensätze seit dem letzten Speichern

/** Markiert geänderte Datensätze mit Zeitstempel (_u) und gelöschte mit einem „Grabstein“ */
function stampChanges() {
  if (!S) return;
  const now = Date.now(), seen = new Map();
  S.tomb = S.tomb || {};
  for (const col of SYNC_COLS) for (const r of S[col]) {
    const { _u, ...rest } = r, j = JSON.stringify(rest);
    if (lastSeen && lastSeen.get(r.id) !== j) r._u = now;
    seen.set(r.id, j);
  }
  const bj = JSON.stringify(S.budgets);
  if (lastSeen) {
    for (const id of lastSeen.keys()) if (id !== '__budgets' && !seen.has(id)) S.tomb[id] = now;
    if (lastSeen.get('__budgets') !== bj) S.budgetsU = now;
  }
  seen.set('__budgets', bj);
  lastSeen = seen;
}
function resetBaseline() { lastSeen = null; stampChanges(); }

/** Führt einen fremden Stand in den lokalen ein: neuere Version gewinnt je Datensatz, Löschungen werden übernommen */
function mergeState(L, R) {
  const tomb = { ...(R.tomb || {}) };
  for (const [k, v] of Object.entries(L.tomb || {})) tomb[k] = Math.max(v, tomb[k] || 0);
  let added = 0, updated = 0, removed = 0;
  for (const col of SYNC_COLS) {
    const m = new Map((L[col] || []).map(r => [r.id, r])), localIds = new Set(m.keys());
    for (const r of R[col] || []) {
      const l = m.get(r.id);
      if (!l) { if (!(tomb[r.id] >= (r._u || 0))) added++; m.set(r.id, r); }
      else if ((r._u || 0) > (l._u || 0)) { m.set(r.id, r); if (JSON.stringify(r) !== JSON.stringify(l)) updated++; }
    }
    L[col] = [...m.values()].filter(r => {
      const dead = tomb[r.id] && tomb[r.id] >= (r._u || 0);
      if (dead && localIds.has(r.id)) removed++;
      return !dead;
    });
  }
  L.tomb = tomb;
  if ((R.budgetsU || 0) > (L.budgetsU || 0)) { L.budgets = R.budgets || {}; L.budgetsU = R.budgetsU; }
  const snaps = new Map((R.snapshots || []).map(s => [s.d, s]));
  for (const s of L.snapshots || []) snaps.set(s.d, s);
  L.snapshots = [...snaps.values()].sort((a, b) => a.d < b.d ? -1 : 1);
  if (!L.settings.name && R.settings?.name) L.settings.name = R.settings.name;
  if (R.settings?.onboarded) { L.settings.onboarded = true; if (!R.settings.demo) L.settings.demo = false; }
  return { added, updated, removed };
}

/** Sync-Datei mit dem eigenen Schlüssel öffnen (gleiches Salt = gleicher Tresor), sonst Passwort nötig */
Vault.decryptOwn = async function (blob) {
  if (!this.key || blob.salt !== b64e(this.salt) || (blob.iter || PBKDF2_ITER) !== this.iter) return null;
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(blob.iv) }, this.key, b64d(blob.ct));
  return JSON.parse(dec.decode(pt));
};
async function decryptSyncText(text, interactive = true) {
  let blob;
  try { blob = JSON.parse(text); } catch { throw new Error('Die Datei ist keine gültige Finanzcockpit-Datei.'); }
  if (!blob || blob.app !== 'finanzcockpit') throw new Error('Die Datei ist keine gültige Finanzcockpit-Datei.');
  syncFileSaved = blob.saved || '';
  try { const own = await Vault.decryptOwn(blob); if (own) return own; } catch { }
  if (!interactive) return null;
  const pw = await promptPassword('Diese Sync-Datei wurde mit einem anderen Tresor-Schlüssel verschlüsselt. Gib das Passwort des anderen Geräts ein.');
  if (pw == null) return null;
  try { return (await Vault.decryptBlob(blob, pw)).data; }
  catch (e) { throw new Error(e.name === 'OperationError' ? 'Falsches Passwort für diese Sync-Datei.' : e.message); }
}
let syncFileSaved = '';
const fmtStamp = iso => iso ? new Date(iso).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) : 'unbekannt';
function applyMerge(remote, quiet = false) {
  const m = migrate(remote);
  const info = { saved: syncFileSaved, accounts: m.accounts.length, tx: m.transactions.length, holdings: m.holdings.length };
  const r = mergeState(S, m);
  C = null; resetBaseline();
  processDue(S);
  S.settings.lastSync = new Date().toISOString();
  const changed = r.added + r.updated + r.removed;
  commit(changed ? `Vom anderen Gerät: ${r.added} neu · ${r.updated} geändert${r.removed ? ` · ${r.removed} gelöscht` : ''}` : quiet ? null : `Nichts Neues – Sync-Datei vom ${fmtStamp(info.saved)}`);
  return { ...r, info };
}
const syncInfoHTML = (r) => `<div class="preview" style="flex-direction:column;gap:4px;text-align:left"><span>Stand der Sync-Datei: <b>${fmtStamp(r.info.saved)}</b></span><span class="muted small">enthält ${r.info.accounts} Konten · ${r.info.tx} Buchungen · ${r.info.holdings} Wertpapiere</span><span class="muted small">übernommen: ${r.added} neu · ${r.updated} geändert · ${r.removed} gelöscht</span></div>`;

function promptPassword(text) {
  return new Promise(res => {
    const root = $('#confirm-root');
    root.innerHTML = `<div class="modal-backdrop top"><form class="modal small" novalidate><header class="modal-head"><h3>Passwort benötigt</h3></header><div class="modal-body"><p class="muted">${text}</p><input class="input" type="password" id="ppw" autocomplete="off"></div><footer class="modal-foot"><span class="grow"></span><button type="button" class="btn ghost" data-r="0">Abbrechen</button><button class="btn primary">Entschlüsseln</button></footer></form></div>`;
    const bd = root.firstElementChild, form = bd.firstElementChild; requestAnimationFrame(() => bd.classList.add('open'));
    const done = v => { document.removeEventListener('keydown', key, true); root.innerHTML = ''; res(v); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); done(null); } };
    document.addEventListener('keydown', key, true);
    form.addEventListener('submit', e => { e.preventDefault(); done($('#ppw').value); });
    form.querySelector('[data-r]').addEventListener('click', () => done(null));
    $('#ppw').focus();
  });
}

/* ---------- Dateizugriff: PC (File System Access API) ---------- */
const HandleStore = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('finanzcockpit-sync', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch { return null; } },
  async set(k, v) { try { const db = await this.open(); await new Promise(res => { const tx = db.transaction('kv', 'readwrite'); v == null ? tx.objectStore('kv').delete(k) : tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch { } },
};
const fsSupported = () => 'showSaveFilePicker' in window && 'showOpenFilePicker' in window;
const FS_TYPES = [{ description: 'Finanzcockpit-Sync', accept: { 'application/octet-stream': ['.fcbak'] } }];
let syncHandle = null, syncBusy = false;
async function loadSyncHandle() { if (fsSupported()) { syncHandle = await HandleStore.get('sync'); if (S && UI.view === 'settings') render(); } }

async function syncWithHandle(h, interactive) {
  if (syncBusy) return false;
  syncBusy = true;
  try {
    let p = await h.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted') {
      if (!interactive) return false;
      p = await h.requestPermission({ mode: 'readwrite' });
      if (p !== 'granted') throw new Error('Der Zugriff auf die Sync-Datei wurde nicht erlaubt.');
    }
    const text = await (await h.getFile()).text();
    let merged = false;
    if (text.trim()) {
      const remote = await decryptSyncText(text, interactive);
      if (!remote) return false;
      applyMerge(remote, !interactive); merged = true;
    }
    await saveChain;
    const blob = await Vault.encryptBlob(S);
    const w = await h.createWritable(); await w.write(JSON.stringify(blob)); await w.close();
    if (!merged) { S.settings.lastSync = new Date().toISOString(); commit(interactive ? 'Sync-Datei angelegt ✅' : null); }
    else if (interactive) toast(`In ${h.name} gespeichert – iCloud/OneDrive lädt sie jetzt hoch`, 'info');
    return true;
  } finally { syncBusy = false; }
}
async function linkSyncFile(existing) {
  try {
    const h = existing ? (await showOpenFilePicker({ types: FS_TYPES }))[0] : await showSaveFilePicker({ suggestedName: 'finanzcockpit-sync.fcbak', types: FS_TYPES });
    syncHandle = h; await HandleStore.set('sync', h);
    await syncWithHandle(h, true);
  } catch (e) { if (e.name !== 'AbortError') toast(e.message || String(e), 'err'); }
}
/** PC: wenige Sekunden nach jeder Änderung still abgleichen – dann ist iCloud/OneDrive immer aktuell */
let autoSyncTimer = null;
function scheduleAutoSync() {
  if (syncBusy || !fsSupported() || !syncHandle) return;
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(trySilentSync, 4000);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && S) trySilentSync(); });
async function trySilentSync() {
  if (!S || !fsSupported()) return;
  if (!syncHandle) syncHandle = await HandleStore.get('sync');
  if (!syncHandle) return;
  try { await syncWithHandle(syncHandle, false); } catch (e) { console.warn('Auto-Sync:', e); }
}

/* ---------- Dateizugriff: Handy (Datei wählen + Teilen) ---------- */
async function shareSyncFile() {
  await saveChain;
  const text = JSON.stringify(await Vault.encryptBlob(S));
  const file = new File([text], 'finanzcockpit-sync.fcbak', { type: 'application/octet-stream' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Finanzcockpit-Sync' }); S.settings.lastSync = new Date().toISOString(); persist(); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  download(file.name, text, 'application/octet-stream');
  S.settings.lastSync = new Date().toISOString(); persist();
}
function mobileSyncModal() {
  openModal({
    title: 'Geräte abgleichen', submit: 'Abgleichen',
    body: `<p class="muted">Die Sync-Datei liegt in deiner Cloud (iCloud Drive, OneDrive, Google Drive …). Ihr Inhalt ist verschlüsselt – die Cloud sieht nur Zeichensalat.</p>
      <div class="stack small"><div><b>1.</b> Sync-Datei auswählen – die Daten werden zusammengeführt.</div><div><b>2.</b> Aktualisierte Datei wieder in denselben Ordner sichern (ersetzen).</div></div>
      ${F.field('Sync-Datei', '<input class="input" type="file" name="file" style="padding-top:9px">')}
      <button type="button" class="btn sm ghost" data-share>${ic('upload', 14)} Noch keine Datei? Jetzt erstellen & sichern</button>`,
    onOpen(form) { form.querySelector('[data-share]').addEventListener('click', shareSyncFile); },
    async onSubmit(fd, form) {
      const file = form.file.files[0]; if (!file) throw new Error('Bitte die Sync-Datei auswählen.');
      if (file.size > 20e6) throw new Error('Die Datei ist zu groß.');
      const remote = await decryptSyncText(await file.text(), true);
      if (!remote) return false;
      const res = applyMerge(remote);
      const ageH = res.info.saved ? (Date.now() - new Date(res.info.saved)) / 36e5 : 0;
      form.querySelector('.modal-body').innerHTML = `<div class="empty" style="padding:8px 4px"><div class="e-ic">✅</div><b>Zusammengeführt!</b></div>${syncInfoHTML(res)}
        ${ageH > 1 ? `<p class="small warn">⚠️ Die Datei ist ${ageH < 48 ? Math.round(ageH) + ' Stunden' : Math.round(ageH / 24) + ' Tage'} alt. Fehlen Zahlen? Dann am anderen Gerät „Jetzt abgleichen“ tippen, kurz warten, bis iCloud die Datei hochgeladen hat, und hier erneut abgleichen.</p>` : ''}
        <p class="small muted">Sichere jetzt die aktualisierte Datei zurück in denselben Cloud-Ordner und wähle dort <b>„Ersetzen“</b>.</p>
        <button type="button" class="btn primary" data-share2>${ic('upload', 16)} Aktualisierte Datei sichern</button>`;
      form.querySelector('[data-share2]').addEventListener('click', async () => { await shareSyncFile(); closeModal(); });
      form.querySelector('[type=submit]').hidden = true;
      return false;
    },
  });
}
function syncSetupModal() {
  openModal({
    title: 'Abgleich einrichten', submit: null, cancel: 'Abbrechen',
    body: `<p class="muted">Speichere die Sync-Datei in einem Ordner, den deine Cloud automatisch synchronisiert – z. B. <b>OneDrive</b>, <b>iCloud Drive</b> oder <b>Google Drive</b>. Die Datei ist Ende-zu-Ende verschlüsselt.</p>
      <div class="choice-grid"><button type="button" class="choice" data-c="new"><span class="choice-ic">🆕</span><b>Neue Sync-Datei</b><small>Für das erste Gerät: Datei im Cloud-Ordner anlegen.</small></button>
      <button type="button" class="choice" data-c="old"><span class="choice-ic">🔗</span><b>Vorhandene verknüpfen</b><small>Die Datei gibt es schon (vom Handy oder anderen PC).</small></button></div>`,
    onOpen(form) { form.addEventListener('click', e => { const c = e.target.closest('[data-c]'); if (!c) return; const existing = c.dataset.c === 'old'; linkSyncFile(existing); closeModal(); }); },
  });
}
async function syncNow() {
  if (!S) return;
  if (!fsSupported()) return mobileSyncModal();
  if (!syncHandle) syncHandle = await HandleStore.get('sync');
  if (!syncHandle) return syncSetupModal();
  try { if (!(await syncWithHandle(syncHandle, true))) toast('Abgleich abgebrochen', 'info'); }
  catch (e) {
    if (e.name === 'NotFoundError') { toast('Die Sync-Datei wurde nicht gefunden – bitte neu verknüpfen.', 'err'); syncHandle = null; await HandleStore.set('sync', null); syncSetupModal(); }
    else toast(e.message || String(e), 'err');
  }
}

/* ---------- Installierbare App ---------- */
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isWeb = () => location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (S && UI.view === 'settings') render(); });
addEventListener('appinstalled', () => { deferredInstall = null; toast('App installiert 🎉'); if (S && UI.view === 'settings') render(); });
async function installApp() {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice.catch(() => { });
  deferredInstall = null; if (S) render();
}
if ('serviceWorker' in navigator && isWeb()) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const waiting = w => toast('Eine neue Version ist da.', 'info', { action: { label: 'Aktualisieren', run: () => w.postMessage('skipWaiting') }, sticky: true });
    if (reg.waiting && navigator.serviceWorker.controller) waiting(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) waiting(w); }); });
    setInterval(() => reg.update().catch(() => { }), 3600e3);
  }).catch(e => console.warn('Service Worker:', e));
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; location.reload(); });
}

function syncCardHTML() {
  const st = S.settings, last = st.lastSync ? new Date(st.lastSync).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) : 'noch nie';
  let install;
  if (isStandalone()) install = `<div class="badge pos">${ic('check', 13, 2.4)} Als App installiert</div><p class="hint" style="margin-top:8px">Startet offline in einem eigenen Fenster.</p>`;
  else if (!isWeb()) install = `<p class="small muted">Du nutzt gerade die <b>lokale Datei</b>. Zum Installieren – auch auf dem Handy – öffne die Web-Version des Finanzcockpits im Browser.</p>`;
  else if (deferredInstall) install = `<p class="small muted" style="margin-bottom:10px">Eigenes App-Symbol, eigenes Fenster, funktioniert offline.</p><button class="btn primary sm" data-action="installApp">${ic('download', 15)} App installieren</button>`;
  else if (isIOS()) install = `<p class="small muted">Tippe in Safari auf <b>Teilen</b> <span style="font-size:15px">⎋</span> und dann auf <b>„Zum Home-Bildschirm“</b>. Danach startet das Cockpit wie eine normale App – auch offline.</p>`;
  else install = `<p class="small muted">Im Browser-Menü <b>„App installieren“</b> bzw. <b>„Als App installieren“</b> wählen (Edge: ⋯ → Apps, Chrome: ⋮ → Streamen, speichern und teilen).</p>`;
  const fs = fsSupported();
  return `<div class="card span-12">${head(`${ic('refresh', 17)} Geräte & Abgleich`, `<span class="sub">Letzter Abgleich: ${last}</span>`)}
    <div class="row2" style="gap:28px;align-items:start">
      <div><div class="field-label" style="margin-bottom:8px">Als App nutzen</div>${install}</div>
      <div><div class="field-label" style="margin-bottom:8px">PC ⇄ Handy abgleichen</div>
        <p class="small muted" style="margin-bottom:10px">Über eine <b>verschlüsselte Sync-Datei</b> in deiner Cloud. Änderungen beider Geräte werden zusammengeführt – nichts geht verloren.${fs && syncHandle ? ` Verknüpft: <b>${esc(syncHandle.name)}</b>` : ''}</p>
        <div class="btn-row"><button class="btn primary sm" data-action="syncNow">${ic('refresh', 15)} ${fs && !syncHandle ? 'Abgleich einrichten' : 'Jetzt abgleichen'}</button>${fs && syncHandle ? `<button class="btn sm ghost" data-action="syncSetup">Andere Datei</button>` : ''}</div>
      </div></div></div>`;
}
Object.assign(ACTIONS, { syncNow: () => syncNow(), syncSetup: () => syncSetupModal(), installApp: () => installApp() });
